name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'public/**', 'next.config.*') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /portfolio
          NEXT_PUBLIC_SITE_URL: https://akhilsingh2.github.io/portfolio
      - uses: actions/cache@v4
        if: github.event_name == 'pull_request'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright
        if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium
      - name: Check internal links
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/site/portfolio
          cp -a out/. /tmp/site/portfolio
          npx --yes serve /tmp/site -p 4177 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:4177/portfolio/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:4177/portfolio/
          ORIGIN=http://127.0.0.1:4177 BASE_PATH=/portfolio node scripts/smoke-nav.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
